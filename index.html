<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Management Auto Republic</title>
<link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #1a1a2e; --muted: #64748b; --line: #e5e7eb;
    --accent: #e94560; --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1020; --card: #1a1a2e; --ink: #f1f5f9; --muted: #94a3b8; --line: #2a2b45; --warn: #f59e0b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 28px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  header img { width: 44px; height: 44px; object-fit: contain; border-radius: 10px; background: #fff; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  header .out { margin-left: auto; background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 10px; padding: 0 14px; min-height: 40px; font: inherit; font-size: 13px; cursor: pointer; }
  nav { display: flex; gap: 8px; overflow-x: auto; white-space: nowrap; margin: 0 -16px 20px; padding: 0 16px 4px;
    scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
  nav button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 10px; }
  section:first-of-type h2 { margin-top: 0; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
  a.tile { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; text-decoration: none; color: inherit; min-height: 76px;
    transition: transform .12s, border-color .12s; }
  a.tile:hover, a.tile:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
  a.tile:active { transform: scale(.99); }
  .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex: none; }
  .tile b { display: block; font-size: 15px; }
  .tile span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .tile span.warn { color: var(--warn); }
  .tile .go { margin-left: auto; color: var(--muted); font-size: 18px; }
  .login { max-width: 360px; margin: 12vh auto 0; text-align: center; background: var(--card);
    border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; }
  .login img { width: 64px; height: 64px; object-fit: contain; margin-bottom: 12px; }
  .login h1 { font-size: 20px; margin: 0 0 6px; }
  .login p { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  .gbtn { width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #fff; color: #1f1f1f; border: 1px solid #dadce0; border-radius: 12px; font: inherit; font-size: 15px;
    font-weight: 600; cursor: pointer; }
  .gbtn:active { background: #f1f3f4; }
  .err { color: var(--accent); font-size: 13px; margin-top: 14px; min-height: 18px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="login" class="wrap" hidden>
    <div class="login">
      <img src="logo.png" alt="">
      <h1>Management</h1>
      <p>Auto Republic · acceso privado</p>
      <button class="gbtn" id="g">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Entrar con Google
      </button>
      <div class="err" id="err"></div>
    </div>
  </div>

  <div id="app" class="wrap" hidden>
    <header>
      <img src="logo.png" alt="">
      <div><h1>Management</h1><p id="who"></p></div>
      <button class="out" id="out">Salir</button>
    </header>
    <nav id="nav"></nav>
    <div id="sections"></div>
  </div>

<script>
  const ALLOWED = 'saul@auto-republic.com';

  // Each dashboard receives #sso=<access_token> and logs Saúl in without asking again.
  // `old` is the address that works today; `domain` takes over once DNS is connected.
  const MENU = [
    { name: 'Ventas', items: [
      { t: 'KPIs de ventas', s: 'Reporte del manager', i: '📊', c: '#10b981', domain: 'https://kpis.auto-republic.com/', old: 'https://helpful-blessing-production-6391.up.railway.app/' },
      { t: 'Producción', s: 'Equipo de ventas · citas · efectividad', i: '🏁', c: '#3b82f6', domain: 'https://produccion.auto-republic.com/', old: 'https://saul-sketch.github.io/ar-sales-production/' },
      { t: 'Reporte diario', s: 'Formulario de visitas', i: '📝', c: '#f59e0b', domain: 'https://reporte.auto-republic.com/', old: 'https://fortunate-presence-production-1aee.up.railway.app/' },
    ]},
    { name: 'Marketing', items: [
      { t: 'Córtex', s: 'Citas y visitas no confiables desde marzo', warn: true, i: '🧠', c: '#e94560', domain: 'https://cortex.auto-republic.com/login', old: 'https://ar-dashboard-production-3b3c.up.railway.app/login' },
    ]},
    { name: 'Finanzas', items: [
      { t: 'Financial Hub', s: 'P&L · cuentas · patrimonio', i: '💰', c: '#64748b', domain: 'https://finanzas.auto-republic.com/login', old: 'https://ar-financial-hub-production.up.railway.app/login' },
    ]},
    { name: 'Reclutamiento', items: [
      { t: 'Reclutamiento', s: 'Tablero de contratación', i: '👥', c: '#8b5cf6', domain: 'https://reclutamiento.auto-republic.com/', old: 'https://saul-sketch.github.io/ar-recruitment-dashboard/' },
      { t: 'Scorecard', s: 'Evaluación de candidatos', i: '✅', c: '#0ea5e9', domain: 'https://scorecard.auto-republic.com/', old: 'https://saul-sketch.github.io/ar-recruitment-scorecard/' },
    ]},
  ];
  // Flip to true once the auto-republic.com addresses answer.
  const USE_DOMAIN = false;

  const sb = supabase.createClient('https://xwxjutaqouaeocvxawlw.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3eGp1dGFxb3VhZW9jdnhhd2x3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTIxMzYsImV4cCI6MjA5MjYyODEzNn0.TOigRbaNL5z3Q7hd4llJyqrC6vZwn_-1R-5JudXtJmU', {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'ar-management-auth', flowType: 'implicit' }
  });
  const $ = (id) => document.getElementById(id);
  let filter = 'Todo';

  function render() {
    const tabs = ['Todo', ...MENU.map(m => m.name)];
    $('nav').innerHTML = tabs.map(t => `<button class="${t === filter ? 'on' : ''}" data-t="${t}">${t}</button>`).join('');
    $('sections').innerHTML = MENU.filter(m => filter === 'Todo' || m.name === filter).map(m => `
      <section><h2>${m.name}</h2><div class="grid">${m.items.map(it => `
        <a class="tile" href="${USE_DOMAIN ? it.domain : it.old}" target="_blank" rel="noopener">
          <div class="ico" style="background:${it.c}22">${it.i}</div>
          <div><b>${it.t}</b><span class="${it.warn ? 'warn' : ''}">${it.s}</span></div>
          <div class="go">↗</div>
        </a>`).join('')}</div></section>`).join('');
  }

  $('nav').onclick = (e) => { const t = e.target.dataset.t; if (t) { filter = t; render(); } };

  // Attach a fresh access token at click time so the dashboard opens already signed in.
  $('sections').addEventListener('click', async (e) => {
    const a = e.target.closest('a.tile');
    if (!a) return;
    e.preventDefault();
    const win = window.open('about:blank', '_blank');
    const { data } = await sb.auth.getSession();
    const token = data.session?.access_token;
    const url = a.href.split('#')[0] + (token ? '#sso=' + encodeURIComponent(token) : '');
    if (win) { win.opener = null; win.location = url; } else { location.href = url; }
  });

  function show(session) {
    if (location.hash.includes('access_token')) history.replaceState(null, '', location.pathname);
    const email = (session?.user?.email || '').toLowerCase();
    if (session && email === ALLOWED) {
      $('who').textContent = email;
      $('login').hidden = true; $('app').hidden = false;
      render();
      return;
    }
    if (session) { sb.auth.signOut(); $('err').textContent = 'Este correo no tiene acceso'; }
    $('app').hidden = true; $('login').hidden = false;
  }

  $('g').onclick = () => sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: location.origin + location.pathname, queryParams: { prompt: 'select_account', hd: 'auto-republic.com' } }
  });
  $('out').onclick = async () => { await sb.auth.signOut(); show(null); };

  sb.auth.getSession().then(({ data }) => show(data.session));
</script>
</body>
</html>
